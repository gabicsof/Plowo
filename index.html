function embaralha(arr,seed){
  let h=0;for(const c of seed)h=(h*31+c.charCodeAt(0))>>>0;
  const rnd=()=>{h=(h*1664525+1013904223)>>>0;return h/4294967296};
  let r,tent=0;
  do{r=arr.map((v,i)=>[v,i]);for(let i=r.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[r[i],r[j]]=[r[j],r[i]]}tent++}
  while(tent<20&&r.every((x,i)=>x[1]===i)&&arr.length>1);
  return r;
}

function iniciaRun(kind,id,lista,volta){
  run={kind,id,fila:lista.map(e=>({...e})),i:0,xp:0,primeira:0,erros:0,refeitos:{},volta};
  novoEx();ir('ex');
}
function novoEx(){
  const e=run.fila[run.i];
  cur={sel:null,fill:e.t==='fill'?e.a.map(()=>null):null,seq:[],txt:'',feito:false,ok:null,ajuda:'',ord:e.t==='order'?embaralha(e.a,e.id):null,tent:run.refeitos[e.id]?2:1};
}
function respondido(e){
  if(e.t==='mc'||e.t==='out'||e.t==='bug')return cur.sel!==null;
  if(e.t==='fill')return cur.fill.every(x=>x!==null);
  if(e.t==='order')return cur.seq.length===e.a.length;
  if(e.t==='write')return true;
}
function corrige(e){
  if(e.t==='mc'||e.t==='out'||e.t==='bug')return cur.sel===e.a;
  if(e.t==='fill')return cur.fill.every((x,i)=>e.bank[x]===e.a[i]);
  if(e.t==='order')return cur.seq.every((x,i)=>cur.ord[x][0]===e.a[i]);
  if(e.t==='write')return e.a.some(x=>normaliza(x)===normaliza(cur.txt));
}
function textoResp(e){
  if(e.t==='mc'||e.t==='out')return e.opts[e.a];
  if(e.t==='bug')return 'linha '+(e.a+1)+': '+e.lines[e.a].trim();
  if(e.t==='fill')return e.a.join(', ');
  if(e.t==='order')return e.a.join('\n');
  return e.a[0];
}

function verificar(){
  const e=run.fila[run.i];
  if(e.t==='write'){const el=document.getElementById('inp');if(el)cur.txt=el.value}cur.ok=!!corrige(e);cur.feito=true;
  const primeira=cur.tent===1;
  let ganho=0;
  if(!e.gen){
    marcaDia();
    if(cur.ok){ganho=run.kind==='desafio'?20+5*(e.diff-1):(primeira?10+5*(e.diff-1):5);darXP(ganho)}
    if(cur.ok&&primeira)run.primeira++;
    if(!cur.ok){run.erros++;S.rev[e.id]={box:0,due:Date.now()+INTERVALOS[0]*DIA}}
    else if(run.kind==='revleve'&&S.rev[e.id]){const r=S.rev[e.id];r.box++;if(r.box>=INTERVALOS.length)delete S.rev[e.id];else r.due=Date.now()+INTERVALOS[r.box]*DIA}
    if(!cur.ok&&run.kind!=='desafio'&&!run.refeitos[e.id]){run.refeitos[e.id]=1;run.fila.push({...e,_re:true})}
    if(run.kind==='desafio'){
      S.desafio[hoje()]={id:e.id,feito:true,ok:cur.ok};
      if(cur.ok){S.acD++;if(S.acD>=2&&S.nivelD<3){S.nivelD++;S.acD=0}}else{S.acD=0;S.nivelD=Math.max(1,S.nivelD-1)}
    }
    salvar();
  }
  cur.ganho=ganho;render();
}
function continuar(){
  run.i++;
  if(run.i>=run.fila.length){concluiRun();return}
  novoEx();render();
}
function concluiRun(){
  let bonus=0;
  const total=run.fila.filter(x=>!x.gen&&!x._re).length||1,prop=run.primeira/total;
  if(run.kind==='licao'&&!S.licoes[run.id]){S.licoes[run.id]=true;bonus=Math.round(20*prop)}
  if(run.kind==='revmod'&&!S.revMod[run.id]){S.revMod[run.id]=true;bonus=Math.round(30*prop)}
  if(bonus)darXP(bonus);
  salvar();
  ctx={bonus};ir('fim',{bonus});
}

const PYV='0.27.7', PYURL='https://cdn.jsdelivr.net/pyodide/v'+PYV+'/full/';
const PYRUN=String.raw`
import sys, io, json, os, base64
os.environ['MPLBACKEND']='agg'

        try:

        except StopIteration:
            raise EOFError('o programa pediu mais entradas do que o teste fornece')
    cont = [0]
    def tr(frame, ev, arg):
        cont[0] += 1
        if cont[0] > 1500000:
            raise TimeoutError('demorou demais (possível laço infinito)')
        return tr
    ns = {'__name__': '__main__', 'input': _input}
    antigo = sys.stdout

`;
let PY=null, pyCarregando=null;
function carregaPython(){
  if(PY)return Promise.resolve(PY);
  if(window.__PY_TESTE){PY=window.__PY_TESTE;return Promise.resolve(PY)}
  if(pyCarregando)return pyCarregando;
  pyCarregando=new Promise((res,rej)=>{
    const s=document.createElement('script');s.src=PYURL+'pyodide.js';
    s.onload=async()=>{
      try{
        const p=await loadPyodide({indexURL:PYURL});
        p.runPython(PYRUN);
        const f=p.globals.get('__rodar');
        const feitos={},pre={numpy:'import numpy',pandas:'import pandas',matplotlib:'import matplotlib.pyplot',statsmodels:'import statsmodels.api, statsmodels.stats.weightstats',scipy:'import scipy'};
        PY={run:(c,i,x)=>JSON.parse(f(c,i,x)),load:async pk=>{for(const n of pk){if(feitos[n])continue;await p.loadPackage(n);if(pre[n])p.runPython(pre[n]);feitos[n]=1}}};
        res(PY);
      }catch(e){pyCarregando=null;rej(e)}
    };
    s.onerror=()=>{pyCarregando=null;rej(new Error('rede'))};
    document.head.appendChild(s);
  });
  return pyCarregando;
}

    }).join('');
  }).join('');
  return topo(8)+`<button class="back" data-a="home">‹ Início</button><div class="tit pad">Laboratório de código</div>
  <div class="sub">Desafios em que você escreve o código. Cada um libera ao concluir a lição indicada.</div>
  ${rec?`<button class="btn" data-a="labrec">Próximo desafio: ${esc(rec.t)}</button>`:''}${grupos}`;
}
function abreDesafio(id){
  const c=LAB.find(x=>x.id===id);
  tela='codigo';ctx={id,cod:LABD[id]!==undefined?LABD[id]:c.ini,tent:0,nd:0,vsol:false,res:null};render();
}
const PTERRO={NameError:'Nome não definido',TypeError:'Tipo inadequado',ValueError:'Valor inadequado',ZeroDivisionError:'Divisão por zero',IndentationError:'Erro de indentação',SyntaxError:'Erro de sintaxe',EOFError:'Faltou entrada',TimeoutError:'Tempo esgotado',IndexError:'Posição inexistente',KeyError:'Chave inexistente',AttributeError:'Atributo inexistente'};
function ptErro(e){const t=String(e).split(':')[0];return PTERRO[t]?PTERRO[t]+' ('+e+')':e}
function resHtml(){
  const r=ctx.res;if(!r)return '';
  if(r.busy==='pk')return '<div class="sub">Carregando as bibliotecas (só na primeira vez, pode levar alguns segundos)…</div>';
  if(r.busy==='load')return '<div class="sub">Carregando o Python (só na primeira vez, pode levar alguns segundos)…</div>';
  if(r.busy)return '<div class="sub">Executando…</div>';
  if(r.erroPy)return '<div class="sub">✗ Não consegui carregar o Python. Verifique a conexão e tente de novo.</div>';
  const gr=r.img?`<img class="gr" alt="gráfico gerado" src="data:image/png;base64,${r.img}">`:'';
  const lista=gr+r.testes.map((t,k)=>`<div class="sub">${t.ok?'✓':'✗'} Teste ${k+1}</div>`).join('');
  if(r.tudo)return `<div class="card c"><div class="big">✓ Resolvido</div>${lista}<div class="sub">XP ganho: <b>${ctx.xpGanho}</b></div>
  <button class="btn" data-a="labrec">Próximo desafio</button><button class="btn sec" data-a="lab">Voltar ao laboratório</button></div>`;
  const f=r.testes.find(t=>!t.ok);
  let det='';
  if(f.i)det+=`<div class="sub">Entrada do teste:</div><pre class="code">${esc(f.i)}</pre>`;
  if(f.x)det+=`<div class="sub">Teste executado depois do seu código:</div><pre class="code">${esc(f.x)}</pre>`;
  if(f.err)det+=`<div class="sub">✗ ${esc(ptErro(f.err))}${f.linha?' · linha '+f.linha:''}</div>`;
  else det+=`<div class="sub">Esperado:</div><pre class="code">${esc(f.o)}</pre><div class="sub">Obtido:</div><pre class="code">${esc(f.obt)||'(nada)'}</pre>`;
  return `<div class="card">${lista}${det}</div>`;
}
function telaCodigo(){
  const c=LAB.find(x=>x.id===ctx.id),t1=c.tests[0];
  const ex=(t1.i?`<div class="sub">Entrada do exemplo:</div><pre class="code">${esc(t1.i)}</pre>`:'')+(t1.x?`<div class="sub">Depois do seu código, o teste executa:</div><pre class="code">${esc(t1.x)}</pre>`:'')+`<div class="sub">Saída esperada:</div><pre class="code">${esc(t1.o)}</pre>`;
  const teclas=[['⇥','tab'],[':',':'],['(','('],[')',')'],['[','['],[']',']'],['{','{'],['}','}'],['"','"'],["'","'"],['=','='],[',',','],['_','_']];
  const kb=`<div class="kb">`+teclas.map(([l,v])=>`<button data-a="ins" data-t="${esc(v)}">${esc(l)}</button>`).join('')+`</div>`;
  const dicas=c.dicas.slice(0,ctx.nd||0).map((d,i)=>`<div class="sub">Dica ${i+1}: ${fmt(d)}</div>`).join('');
  const ocupado=ctx.res&&ctx.res.busy;
  return topo(9)+`<button class="back" data-a="lab">‹ Laboratório</button>
  <div class="lbl">Módulo ${c.mod} · Nv ${c.diff}${labFeito(c.id)?' · ✓ resolvido':''}</div><div class="tit">${esc(c.t)}</div>
  <div class="q">${fmt(c.q).replace(/\n/g,'<br>')}</div>${ex}
  <textarea class="ed" id="ed" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" ${ocupado?'disabled':''}>\n${esc(ctx.cod)}</textarea>${kb}
  <button class="btn" data-a="exec" ${ocupado?'disabled':''}>Executar e testar</button>
  <div class="duo"><button class="btn sec" data-a="dica" ${(ctx.nd||0)>=c.dicas.length?'disabled':''}>Dica</button><button class="btn sec" data-a="versol" ${ctx.tent>=3||labFeito(c.id)?'':'disabled'}>Ver solução</button><button class="btn sec" data-a="recomecar">Recomeçar</button></div>
  ${dicas}${ctx.vsol?`<div class="lbl pad">Solução</div><pre class="code">${esc(c.sol)}</pre>`:(ctx.tent>=3||labFeito(c.id)?'':'<div class="sub">A solução libera depois de 3 tentativas.</div>')}
  ${resHtml()}`;
}
async function executaCodigo(){
  const c=LAB.find(x=>x.id===ctx.id),meu=ctx;
  meu.cod=document.getElementById('ed').value;LABD[c.id]=meu.cod;
  meu.res={busy:PY?'run':'load'};render();
  let py;try{py=await carregaPython()}catch(e){if(ctx===meu){meu.res={erroPy:true};render()}return}
  if(ctx!==meu)return;
  if(c.pk&&py.load){meu.res={busy:'pk'};render();try{await py.load(c.pk)}catch(e){if(ctx===meu){meu.res={erroPy:true};render()}return}if(ctx!==meu)return}
  meu.res={busy:'run'};render();
  const testes=[];let img=null;
  for(const t of c.tests){
    let r;try{r=await py.run(meu.cod,t.i,t.x)}catch(e){r={out:'',err:'Falha ao executar: '+(e&&e.message),linha:null}}
    const obt=normSaida(r.out||'');
    if(r.img&&!img)img=r.img;
    testes.push({ok:!r.err&&obt===normSaida(t.o),i:t.i,x:t.x,o:t.o,obt,err:r.err,linha:r.linha});
  }
  meu.tent++;
  const tudo=testes.every(t=>t.ok);
  meu.res={testes,tudo,img};
  if(tudo)registraAcerto(c,meu);
  if(ctx===meu)render();
}
function registraAcerto(c,k){
  S.lab=S.lab||{};const prev=S.lab[c.id],nl=S.nivelL||1;
  let xp;
  if(prev&&prev.ok)xp=5;
  else{
    xp=k.vsol?5:Math.max(10,30+10*(c.diff-1)-5*(k.nd||0));
    if(!k.vsol&&!k.nd&&k.tent<=2)S.nivelL=Math.min(3,nl+1);
    else if(k.vsol||k.tent>=4)S.nivelL=Math.max(1,nl-1);
  }
  S.lab[c.id]={ok:true,t:(prev?prev.t:0)+k.tent,d:k.nd||0,s:k.vsol?1:0};
  S.xp+=xp;k.xpGanho=xp;
  marcaDia();salvar();
}
function inserirTexto(t){
  const ta=document.getElementById('ed');if(!ta)return;
  const a=ta.selectionStart,b=ta.selectionEnd;
  ta.value=ta.value.slice(0,a)+t+ta.value.slice(b);
  ta.selectionStart=ta.selectionEnd=a+t.length;ctx.cod=ta.value;ta.focus();
}
Object.assign(A,{
  lab:()=>ir('lab'),
  labrec:()=>{const c=labRecomendado();c?abreDesafio(c.id):ir('lab')},
  lababre:d=>abreDesafio(d.id),
  ins:d=>inserirTexto(d.t==='tab'?'    ':d.t),
  exec:()=>executaCodigo(),
  dica:()=>{const c=LAB.find(x=>x.id===ctx.id);if((ctx.nd||0)<c.dicas.length){ctx.cod=document.getElementById('ed').value;ctx.nd=(ctx.nd||0)+1;render()}},
  versol:()=>{ctx.cod=document.getElementById('ed').value;ctx.vsol=true;render()},
  recomecar:()=>{const c=LAB.find(x=>x.id===ctx.id);ctx.cod=c.ini;LABD[c.id]=c.ini;ctx.res=null;render()}
});
document.addEventListener('input',ev=>{if(ev.target.id==='ed'){ctx.cod=ev.target.value;LABD[ctx.id]=ctx.cod}});
document.addEventListener('mousedown',ev=>{if(ev.target.closest&&ev.target.closest('.kb'))ev.preventDefault()});
document.addEventListener('keydown',ev=>{
  if(ev.target.id!=='ed')return;
  const ta=ev.target;
  if(ev.key==='Tab'){ev.preventDefault();inserirTexto('    ')}
  else if(ev.key==='Enter'){
    const a=ta.selectionStart,antes=ta.value.slice(0,a),ult=antes.slice(antes.lastIndexOf('\n')+1);
    const ind=ult.match(/^ */)[0]+(/:\s*$/.test(ult)?'    ':'');
    ev.preventDefault();inserirTexto('\n'+ind);
  }
});
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-a]');if(!b||b.disabled)return;
  const f=A[b.dataset.a];if(f)f(b.dataset);
});
document.addEventListener('input',ev=>{if(ev.target.id==='inp')cur.txt=ev.target.value});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Enter'&&(ev.target.id==='lu'||ev.target.id==='lp'||ev.target.id==='lp2')){ctx.modo==='cad'?cadastrar():entrar();return}
  if(ev.key==='Enter'&&ev.target.id==='inp'&&cur&&!cur.feito)verificar();
});

/* ---------- início ---------- */
(async function boot(){
  $app.innerHTML='<div class="sub pad">Carregando…</div>';
  await Promise.race([iniciaArmazenamento(),new Promise(r=>setTimeout(r,15000))]);
  if(DB){
    try{
      const user=await new Promise(res=>{const off=FB.au.onAuthStateChanged(FB.auth,u=>{off();res(u)})});
      if(user){await abreConta();if(ref){registraAbertura();salvar();ir('home');return}}
    }catch(e){}
  }
  ir('login');
})();
